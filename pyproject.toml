[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidome"
dynamic = ["version"]
description = "Cross-species functional evidence reports for pathway and upstream-regulator analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Kenneth L. Jones", email = "Ken.Jones@bioinformaticsolutions.com" }]
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]
dependencies = ["matplotlib>=3.5", "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/BioinformaticSolutions/evidome"
Source = "https://github.com/BioinformaticSolutions/evidome"
"Input format" = "https://github.com/BioinformaticSolutions/evidome/blob/main/src/evidome/docs/INPUT_FORMAT.md"
Issues = "https://github.com/BioinformaticSolutions/evidome/issues"

[project.scripts]
evidome = "evidome.cli:main"

[tool.setuptools.dynamic]
version = { attr = "evidome.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The evidence browser page, copied into every evidence zip, and the input-format document.
[tool.setuptools.package-data]
evidome = ["web/*.html", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
